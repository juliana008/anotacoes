<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Lista</h1>
    <ul>
        <li>HTML</li>
        <ul>
            <li>dfghjklç
                <ul></ul>
            </li>
        </ul>
        <li>CSS</li>
    </ul>

    <h1>Termos e definições</h1>
    <dl>
        <dt>HTML</dt>
        <dd>Estrutura páginas web.</dd>
        <dt>CSS</dt>
        <dd>Define apresentação visual.</dd>
    </dl>

    <h1>Tabela</h1>

    <table>
        <thead>
            <tr>
                <th>Aluno</th>
                <th>Nota</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana</td>
                <td>9,0</td>
            </tr>
            <tr>
                <td>Caio</td>
                <td>8,5</td>
            </tr>
        </tbody>
    </table>



    <h1>Formulário</h1>

    <form action="/cadastrar" method="post">
        <label for="nome">Nome:</label>
        <input id="nome" name="nome" type="text" required>
        <button type="submit">
            Cadastrar
        </button>
    </form>


    <h1>Label</h1>
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" placeholder="nome@exemplo.com">


    <h1>Input</h1>

    <input type="text" name="nome">
    <input type="email" name="email">
    <input type="password" name="senha">
    <input type="number" min="0" max="100">
    <input type="date" name="data">
    <input type="checkbox" name="termos">


      <h1>Textos e escolhas</h1>

    <textarea name="mensagem" rows="5" placeholder="Digite sua mensagem"></textarea>
    <select name="curso">
        <option value="">Selecione</option>
        <option value="html">HTML</option>
        <option value="css">CSS</option>
    </select>

    <h1>Botões</h1>

    <button type="submit">Enviar</button>
    <button type="reset">Limpar</button>
    <button type="button" onclick="alert('Olá!')">
        Mostrar mensagem
    </button>



</body>
</html>
