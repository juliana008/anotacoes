<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!--css inline-->
    <!--Serve para quando o projeto já segu um padrão e se quer fazer alterações localizadas-->

    <div id = "div1" style="width: 100px; height: 100px;" background="black"></div>

    <!--css interno-->
    <!--setar o layout padrão-->
    <style>
        #div2{
            width: 100px;
            height: 100px;
            background-color: blue;
            }

        #div1{
            border-radius: 20px;
        }
        #div1:hover{
            background-color: white;
        }
    </style>


    <div id="div2"></div>
    
</body>
</html>
